name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Single-File EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Windows Release
        run: |
          dotnet publish RDPVault\RDPVault.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:TreatWarningsAsErrors=true -o obj\SingleFile_final
          mkdir compiled -Force
          Move-Item -Path obj\SingleFile_final\RDPVault.exe -Destination compiled\RDPVault.exe -Force

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: compiled\RDPVault.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET Android Workload
        run: dotnet workload install android

      - name: Build and Sign Android APK
        run: |
          set -e
          KEYSTORE_PATH="$(pwd)/RDPVault.Android/rdpvault-release.keystore"

          if [ ! -f "$KEYSTORE_PATH" ] || ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "RdpVaultReleasePass2026!" >/dev/null 2>&1; then
            echo "Generating production release keystore with Java keytool..."
            rm -f "$KEYSTORE_PATH"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias rdpvault \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "RdpVaultReleasePass2026!" \
              -keypass "RdpVaultReleasePass2026!" \
              -dname "CN=RDPVault, OU=Security, O=OpenSource, L=Global, S=Global, C=US"
          fi

          echo "Publishing Android APK with Release configuration..."
          dotnet publish RDPVault.Android/RDPVault.Android.csproj -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$KEYSTORE_PATH" \
            -p:AndroidSigningStorePass="RdpVaultReleasePass2026!" \
            -p:AndroidSigningKeyAlias=rdpvault \
            -p:AndroidSigningKeyPass="RdpVaultReleasePass2026!"

          mkdir -p compiled

          SIGNED_APK=$(find RDPVault.Android/bin/Release -type f -name "*-Signed.apk" | head -n 1)
          if [ -n "$SIGNED_APK" ]; then
            echo "Found dotnet-signed APK: $SIGNED_APK"
            cp "$SIGNED_APK" compiled/RDPVault.apk
          else
            echo "Finding unsigned APK to align and sign manually..."
            RAW_APK=$(find RDPVault.Android/bin/Release -type f -name "*.apk" | head -n 1)
            if [ -z "$RAW_APK" ]; then
              echo "Error: No APK file produced by dotnet publish!"
              exit 1
            fi

            ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)

            echo "Aligning APK with $ZIPALIGN..."
            $ZIPALIGN -p -f -v 4 "$RAW_APK" compiled/aligned.apk

            echo "Signing APK with $APKSIGNER (v1, v2, v3 schemes)..."
            $APKSIGNER sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass pass:"RdpVaultReleasePass2026!" \
              --ks-key-alias rdpvault \
              --key-pass pass:"RdpVaultReleasePass2026!" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out compiled/RDPVault.apk \
              compiled/aligned.apk
          fi

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Verifying final APK signature using $APKSIGNER..."
          $APKSIGNER verify --verbose --print-certs compiled/RDPVault.apk
          echo "APK Verification SUCCESS: Package is signed and fully valid for installation."

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: compiled/RDPVault.apk
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets to GitHub
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Generate Tag & Release Notes
        id: vars
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d')"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          # Delete any conflicting existing release with the same tag
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" \
            release-assets/RDPVault.exe \
            release-assets/RDPVault.apk \
            --title "RDP Vault $TAG" \
            --notes "Production build published by automated CI pipeline. Contains both Windows x64 (RDPVault.exe) and Android APK (RDPVault.apk)." \
            --latest
