name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Single-File EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Windows Release
        run: |
          dotnet publish RDPVault\RDPVault.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:TreatWarningsAsErrors=true -o obj\SingleFile_final
          mkdir compiled -Force
          Move-Item -Path obj\SingleFile_final\RDPVault.exe -Destination compiled\RDPVault.exe -Force

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: compiled\RDPVault.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET Android Workload
        run: dotnet workload install android

      - name: Build Android APK
        run: |
          dotnet publish RDPVault.Android/RDPVault.Android.csproj -c Release -p:AndroidPackageFormat=apk
          mkdir -p compiled
          APK_PATH=$(find RDPVault.Android/bin/Release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced!"
            exit 1
          fi
          cp "$APK_PATH" compiled/RDPVault.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: compiled/RDPVault.apk
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets to GitHub
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Generate Tag & Release Notes
        id: vars
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d')"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          # Delete any conflicting existing release with the same tag
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" \
            release-assets/RDPVault.exe \
            release-assets/RDPVault.apk \
            --title "RDP Vault $TAG" \
            --notes "Production build published by automated CI pipeline. Contains both Windows x64 (RDPVault.exe) and Android APK (RDPVault.apk)." \
            --latest
